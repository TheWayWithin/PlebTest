[build]
builder = "nixpacks"
buildCommand = "npm run build"

[build.env]
NIXPACKS_NODE_VERSION = "20"

[deploy]
startCommand = "npm run start:auto"
# Restart policy: ON_FAILURE restarts on crash, up to 3 times
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Health check configuration (used by worker service)
# Worker exposes /health on port 8080 (HEALTH_PORT env var)
# Railway pings this endpoint; unhealthy for 30s triggers restart
healthcheckPath = "/health"
healthcheckTimeout = 30
