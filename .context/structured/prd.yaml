tech_stack:
  auth: "Supabase (OAuth: Google, GitHub + email/password)"
  payment: "Stripe"
  llm: "OpenRouter (model-agnostic)"
  database: "Supabase/Postgres"
  hosting: "Vercel or Railway"
  email: "TBD"
  analytics: "TBD"
  error_tracking: "Sentry (recommended)"
  web_scraping: "TBD (for External Injection)"
  cdn: "TBD (for PDF report storage/delivery)"

  integration_points:
    stripe_webhooks:
      - "subscription created"
      - "payment failed"
      - "subscription cancelled"
    openrouter:
      - "persona generation"
      - "conversation handling"
      - "report generation"
    email_service:
      - "verification"
      - "password reset"
      - "trial reminders"
      - "report ready"

phases:
  - phase: 0
    name: "Landing Page"
    timeline: "Now"
    deliverables:
      - "Landing page with positioning"
      - "Waitlist capture"
      - "Demo walkthrough"
      - "Basic analytics"

  - phase: 1
    name: "Core Loop MVP"
    timeline: "End January 2026"
    scope: "Private testing only"
    deliverables:
      - "Quick Fire Mode (F-029)"
      - "Data Carry-Over (F-030)"
      - "Auth + Basic Billing (F-001 to F-005)"
      - "Core Validation Loop (F-006 to F-022)"
      - "Interactive Mode (F-020)"
      - "Basic Verdict (F-022)"
      - "Anti-Sycophancy Engine active"

  - phase: 2
    name: "Full MVP & Virality"
    timeline: "February 2026"
    scope: "Public launch"
    deliverables:
      - "Spectator Mode + Nudge Buttons (F-021, F-037)"
      - "The Assumption Board (F-033)"
      - "The Reality Check Panel (F-034)"
      - "Pushback Presets (F-035)"
      - "Pre-Mortem Mode (F-036)"
      - "External Injection (F-031)"
      - "Assumption Import (F-032)"
      - "Shareable Reports (F-023)"
      - "Full Billing Lifecycle (F-025 to F-028)"

  - phase: 3
    name: "Scale"
    timeline: "March - December 2026"
    deliverables:
      - "Team/organization accounts"
      - "API access"
      - "Side-by-side idea comparison"
      - "Multi-language support"
      - "Enterprise SSO"

non_negotiables:
  - "Card captured upfront (even for trials)"
  - "AI must challenge, not flatter"
  - "Reports must be shareable without login"
  - "Mobile-responsive (founders on the go)"
  - "Three-environment setup required (dev/staging/production)"
  - "Quick Fire Mode as primary entry point"

priorities:
  - priority: 1
    item: "Quick Fire hook (≤60 sec to Risk Score)"
  - priority: 2
    item: "Time to first verdict (≤10 min onboarding)"
  - priority: 3
    item: "Anti-sycophancy quality in conversations"
  - priority: 4
    item: "Reliable payment flow"
  - priority: 5
    item: "Shareable reports for virality"

