metadata:
  source_file: "Documents/foundations/prds/plebtest-prd-v2.md"
  version: "2.0"
  last_updated: "January 18, 2026"
  status: "Complete"
  owner: "Jamie"

product:
  name: "PlebTest"
  tagline: "Kill duds. Find winners."
  type: "SaaS"
  stage: "MVP"
  target_launch: "February 2026"

  elevator_pitch: "PlebTest gives founders who can't—or won't—pick up the phone a way to validate ideas using AI customer simulations. Get honest feedback from thousands of AI personas built to challenge your assumptions, not confirm them. Know whether to kill, pivot, or build—in minutes, not months."

  target_users: "Solo founders and side-hustle builders who avoid cold calls but need to validate ideas before wasting months building the wrong thing. Technical builders, time-poor founders, and first-timers with phone anxiety."

vision:
  statement: "The fear of customer discovery no longer stops anyone. Founders launch knowing, not hoping."
  mission: "I give founders who dread picking up the phone—or are simply too time-poor—a way to kill bad ideas fast, so they can finally get to the great one."

problem_statement:
  problem: "Founders skip customer validation because talking to strangers is painful. They build blind, discover too late nobody wants it, and waste months on the wrong idea."
  evidence:
    - "42% of startups fail from no market need"
    - "Founders avoid cold calls due to phone anxiety, introversion, or time constraints"
    - "ChatGPT/friends give sycophantic feedback that confirms bad ideas"
  impact:
    - "3-6 months wasted building the wrong thing"
    - "Runway burned on features nobody wants"
    - "Winning ideas sit unbuilt while chasing losers"

personas:
  primary:
    name: "The Builder"
    archetype: "Technical Solo Founder"
    demographics: "Developers, engineers, technical founders. Solo or very early stage (0-2 people)."
    goals:
      - "Ship products people actually want"
      - "Avoid wasting months building the wrong thing"
    pain_points:
      - "Would rather code than cold-call"
      - "Paralyzed by phone anxiety"
      - "Fears rejection from strangers"
    tech_savviness: "High"
    willingness_to_pay: "$10-50/month"
    where_found:
      - "Twitter/X #buildinpublic"
      - "Indie Hackers"
      - "Hacker News"
      - "Reddit"

  secondary:
    name: "The Night-Owl"
    archetype: "Side-Hustle Optimizer"
    demographics: "Full-time employed, building on the side. Pre-revenue side project."
    goals:
      - "Validate ideas in evenings/weekends without disrupting day job"
    pain_points:
      - "Can't schedule calls during business hours"
      - "Limited time, needs async solutions"
    tech_savviness: "Medium-High"
    willingness_to_pay: "$10-20/month"

  tertiary:
    name: "The Expert"
    archetype: "Anxious First-Time Founder"
    demographics: "Domain experts starting their first business. Often leaving corporate."
    goals:
      - "Test ideas in a safe environment"
      - "Build confidence"
    pain_points:
      - "Strong expertise, weak confidence"
      - "Crippling imposter syndrome"
    tech_savviness: "Medium"
    willingness_to_pay: "$10-20/month"

  anti_personas:
    - "Enjoys networking and cold outreach"
    - "Wants validation theater for investors"
    - "No specific idea yet—just 'exploring'"
    - "Defensive about their idea, can't handle truth"

value_proposition:
  for: "founders who can't—or won't—pick up the phone"
  who: "need to validate ideas but dread talking to strangers"
  product_is: "gives your market a voice"
  that: "tells you which ideas to kill, pivot, or build"
  unlike: "building and praying, asking ChatGPT, or forcing yourself through painful cold calls"
  because: "uses AI personas built to challenge your assumptions, not confirm them—so you hear real objections before you build the wrong thing"

