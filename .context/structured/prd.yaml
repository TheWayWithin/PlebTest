data_model:
  entities:
    - name: "User"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "email", type: "String"}
        - {name: "name", type: "String"}
        - {name: "country", type: "String"}
        - {name: "subscription_tier", type: "Enum", values: ["Solo", "Growth", "Scale", "Pro"]}
        - {name: "stripe_customer_id", type: "String"}
        - {name: "vat_id", type: "String", optional: true}
        - {name: "created_at", type: "Timestamp"}

    - name: "Idea"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "user_id", type: "UUID", fk: "User"}
        - {name: "name", type: "String"}
        - {name: "quick_fire_score", type: "Integer", nullable: true}
        - {name: "quick_fire_objection", type: "Text", nullable: true}
        - {name: "created_at", type: "Timestamp"}

    - name: "Proposal"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "idea_id", type: "UUID", fk: "Idea"}
        - {name: "status", type: "Enum", values: ["Draft", "Submitted", "Testing", "Tested", "Cancelled", "Archived"]}
        - {name: "problem", type: "Text"}
        - {name: "current_workarounds", type: "Text"}
        - {name: "solution", type: "Text"}
        - {name: "hypotheses", type: "Text"}
        - {name: "pricing_assumption", type: "Text", optional: true}
        - {name: "competitors", type: "Text", optional: true}
        - {name: "external_context", type: "Text", optional: true}
        - {name: "external_source_url", type: "String", optional: true}
        - {name: "created_at", type: "Timestamp"}
        - {name: "updated_at", type: "Timestamp"}

    - name: "Assumption"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "proposal_id", type: "UUID", fk: "Proposal"}
        - {name: "statement", type: "Text"}
        - {name: "priority", type: "Integer", range: "1-5"}
        - {name: "confidence_score", type: "Decimal", nullable: true, range: "0-100"}
        - {name: "evidence_for", type: "JSON", nullable: true}
        - {name: "evidence_against", type: "JSON", nullable: true}
        - {name: "recommended_action", type: "Enum", values: ["Validate", "Pivot", "Kill", "Explore"], nullable: true}
        - {name: "created_at", type: "Timestamp"}

    - name: "ICP"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "proposal_id", type: "UUID", fk: "Proposal"}
        - {name: "name", type: "String"}
        - {name: "demographics", type: "Text"}
        - {name: "psychographics", type: "Text"}
        - {name: "context", type: "Text"}
        - {name: "pain_intensity", type: "Enum", values: ["Annoying", "Costly", "Blocking"]}
        - {name: "current_solutions", type: "Text"}
        - {name: "decision_role", type: "Enum", values: ["Decision-maker", "Influencer", "End-user", "Blocker"]}
        - {name: "adoption_tendency", type: "Enum", values: ["Early Adopter", "Early Majority", "Late Majority", "Laggard"]}
        - {name: "created_at", type: "Timestamp"}

    - name: "Persona"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "icp_id", type: "UUID", fk: "ICP"}
        - {name: "name", type: "String"}
        - {name: "demographics", type: "JSON"}
        - {name: "psychographics", type: "JSON"}
        - {name: "openness", type: "Integer", range: "1-100"}
        - {name: "conscientiousness", type: "Integer", range: "1-100"}
        - {name: "extraversion", type: "Integer", range: "1-100"}
        - {name: "agreeableness", type: "Integer", range: "1-100"}
        - {name: "neuroticism", type: "Integer", range: "1-100"}
        - {name: "skepticism_level", type: "Enum", values: ["Low", "Medium", "High"]}
        - {name: "generated_at", type: "Timestamp"}

    - name: "Validation Test"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "proposal_id", type: "UUID", fk: "Proposal"}
        - {name: "parent_test_id", type: "UUID", nullable: true}
        - {name: "version", type: "Integer", default: 1}
        - {name: "test_mode", type: "Enum", values: ["Quick", "Standard", "Deep"]}
        - {name: "validation_mode", type: "Enum", values: ["Interactive", "Spectator", "PreMortem"]}
        - {name: "pushback_preset", type: "Enum", values: ["Cheerleader", "Pragmatist", "Critic"]}
        - {name: "icp_ids", type: "Array"}
        - {name: "persona_count", type: "Integer"}
        - {name: "status", type: "Enum", values: ["Pending", "In Progress", "Completed", "Cancelled", "Failed"]}
        - {name: "report_id", type: "UUID", nullable: true}
        - {name: "created_at", type: "Timestamp"}
        - {name: "started_at", type: "Timestamp"}
        - {name: "completed_at", type: "Timestamp"}

    - name: "Session"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "validation_test_id", type: "UUID", fk: "Validation Test"}
        - {name: "persona_id", type: "UUID", fk: "Persona"}
        - {name: "status", type: "Enum", values: ["Pending", "Active", "Completed", "Abandoned", "Expired"]}
        - {name: "mode", type: "Enum", values: ["Interactive", "Spectator"]}
        - {name: "conversation", type: "JSON"}
        - {name: "message_count", type: "Integer"}
        - {name: "user_message_count", type: "Integer"}
        - {name: "nudge_count", type: "Integer"}
        - {name: "avg_response_time_seconds", type: "Integer"}  # NEW: Was missing
        - {name: "need_validated", type: "Boolean"}
        - {name: "solution_resonated", type: "Boolean"}
        - {name: "key_objections", type: "JSON"}
        - {name: "anti_sycophancy_triggers", type: "Integer"}
        - {name: "score", type: "Decimal"}
        - {name: "llm_model_version", type: "String"}
        - {name: "prompt_version", type: "String"}
        - {name: "started_at", type: "Timestamp"}
        - {name: "completed_at", type: "Timestamp"}

    - name: "Report"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "validation_test_id", type: "UUID", fk: "Validation Test"}
        - {name: "verdict", type: "Enum", values: ["Kill", "Pivot", "Build"]}
        - {name: "confidence_score", type: "Enum", values: ["High", "Medium", "Low"]}
        - {name: "need_validation_summary", type: "Text"}
        - {name: "solution_validation_summary", type: "Text"}
        - {name: "assumption_board", type: "JSON"}
        - {name: "reality_check_plan", type: "JSON"}
        - {name: "strongest_signals", type: "JSON"}
        - {name: "key_objections", type: "JSON"}
        - {name: "risk_factors", type: "JSON"}
        - {name: "next_steps", type: "JSON"}
        - {name: "pivot_suggestions", type: "Text"}
        - {name: "pre_mortem_findings", type: "JSON", nullable: true}  # NEW: Was missing
        - {name: "share_token", type: "String"}
        - {name: "is_public", type: "Boolean"}
        - {name: "user_rating", type: "Integer", nullable: true, range: "1-5"}
        - {name: "generation_version", type: "String"}
        - {name: "generated_at", type: "Timestamp"}

    - name: "Iteration"
      attributes:
        - {name: "id", type: "UUID"}
        - {name: "proposal_id", type: "UUID", fk: "Proposal"}
        - {name: "iteration_number", type: "Integer"}
        - {name: "changes_summary", type: "Text"}
        - {name: "previous_verdict", type: "Enum", values: ["Kill", "Pivot", "Build"]}
        - {name: "created_at", type: "Timestamp"}

  relationships:
    - {from: "User", to: "Idea", type: "One-to-Many"}
    - {from: "Idea", to: "Proposal", type: "One-to-Many"}
    - {from: "Proposal", to: "ICP", type: "One-to-Many"}
    - {from: "Proposal", to: "Assumption", type: "One-to-Many"}
    - {from: "Proposal", to: "Iteration", type: "One-to-Many", max: 10}
    - {from: "ICP", to: "Persona", type: "One-to-Many"}
    - {from: "Proposal", to: "Validation Test", type: "One-to-Many"}
    - {from: "Validation Test", to: "Session", type: "One-to-Many"}
    - {from: "Validation Test", to: "Report", type: "One-to-One"}
    - {from: "Session", to: "Persona", type: "Many-to-One"}

state_machines:
  proposal:
    states: ["Draft", "Submitted", "Testing", "Tested", "Cancelled", "Archived"]
    transitions:
      - {from: "Draft", to: "Submitted"}
      - {from: "Submitted", to: "Testing"}
      - {from: "Submitted", to: "Draft"}
      - {from: "Testing", to: "Tested"}
      - {from: "Testing", to: "Cancelled"}
      - {from: "Tested", to: "Draft"}
      - {from: "Tested", to: "Archived"}
      - {from: "Cancelled", to: "Draft"}
      - {from: "Archived", to: "Draft"}

  validation_test:
    states: ["Pending", "In Progress", "Completed", "Cancelled", "Failed"]
    transitions:
      - {from: "Pending", to: "In Progress"}
      - {from: "Pending", to: "Cancelled"}
      - {from: "In Progress", to: "Completed"}
      - {from: "In Progress", to: "Cancelled"}
      - {from: "In Progress", to: "Failed"}
      - {from: "Failed", to: "Pending"}

  session:
    states: ["Pending", "Active", "Completed", "Abandoned", "Expired"]
    transitions:
      - {from: "Pending", to: "Active"}
      - {from: "Pending", to: "Expired"}
      - {from: "Active", to: "Completed"}
      - {from: "Active", to: "Abandoned"}
      - {from: "Active", to: "Expired"}
    timeout: "30 minutes inactivity → Expired"

  subscription:
    states: ["Trial", "Active", "Past Due", "Cancelled", "Expired"]
    transitions:
      - {from: "Trial", to: "Active"}
      - {from: "Trial", to: "Expired"}
      - {from: "Active", to: "Past Due"}
      - {from: "Active", to: "Cancelled"}
      - {from: "Past Due", to: "Active"}
      - {from: "Past Due", to: "Cancelled"}
      - {from: "Cancelled", to: "Active", condition: "resubscribe within 30 days"}
      - {from: "Expired", to: "Active"}

  report:
    states: ["Generating", "Ready", "Public", "Archived"]
    transitions:
      - {from: "Generating", to: "Ready"}
      - {from: "Ready", to: "Public"}
      - {from: "Ready", to: "Archived"}
      - {from: "Public", to: "Ready"}
      - {from: "Public", to: "Archived"}

business_rules:
  tier_limits:
    - {tier: "Solo", products: 1, tests_per_month: 10, price: 9.95}
    - {tier: "Growth", products: 3, tests_per_month: 30, price: 19.95}
    - {tier: "Scale", products: 10, tests_per_month: 100, price: 29.95}
    - {tier: "Pro", products: 20, tests_per_month: 200, price: 49.95}

  enforcement:
    - "IF active_ideas ≥ tier limit THEN block new idea creation"
    - "IF tests_this_month ≥ tier limit THEN block new tests"
    - "Tests reset on billing anniversary (not calendar month)"
    - "Upgrade: new limits apply immediately"
    - "Downgrade: takes effect next billing cycle"

  verdict_logic:
    - {need_validation: "<40%", solution_resonance: "Any", verdict: "Kill"}
    - {need_validation: "40-69%", solution_resonance: "Any", verdict: "Pivot"}
    - {need_validation: "70%+", solution_resonance: "<60%", verdict: "Pivot"}
    - {need_validation: "70%+", solution_resonance: "60%+", verdict: "Build"}

  confidence_score:
    - {level: "High", rule: "Score variance < 15% AND persona_count ≥ 10"}
    - {level: "Medium", rule: "Variance 15-30% OR persona_count 5-9"}
    - {level: "Low", rule: "Variance > 30% OR persona_count < 5"}

  iteration_rules:
    - "IF Proposal edited after Test complete THEN create Iteration record"
    - "Maximum 10 iterations per proposal"

anti_sycophancy_engine:
  purpose: "Core differentiator ensuring AI personas challenge user assumptions rather than confirming them"

  skeptic_heavy_default:
    distribution:
      - {level: "High", percent: 40, behavior: "Actively challenges claims, asks hard questions, expresses doubt"}
      - {level: "Medium", percent: 40, behavior: "Balanced but requires proof, probes weak points"}
      - {level: "Low", percent: 20, behavior: "More receptive but still questions assumptions"}
    rationale: "Real markets contain more skeptics than enthusiasts. Over-representing skeptics helps founders hear objections early."

  pushback_presets:
    - {preset: 1, name: "The Cheerleader", description: "Supportive but honest. Will validate real strengths while noting concerns.", use_case: "Early confidence building, identifying what works"}
    - {preset: 2, name: "The Pragmatist", description: "Balanced, real-world perspective. Questions feasibility and value prop.", use_case: "Standard validation (default)"}
    - {preset: 3, name: "The Critic", description: "Aggressive devil's advocate. Finds every flaw, challenges everything.", use_case: "Stress-testing before major investment"}
    default: "The Pragmatist"
    implementation_notes:
      - "Preset affects persona system prompts"
      - "Does NOT change the underlying skepticism distribution"
      - "User can override per-test"

  interviewer_principles:
    - {principle: "Ask about their life, not your idea", implementation: "Opens with context questions before introducing solution"}
    - {principle: "Ask about specifics in the past", implementation: "'Tell me about the last time...' not 'Would you...'"}
    - {principle: "Talk less, listen more", implementation: "Interviewer speaks < 30% of conversation"}
    - {principle: "Push past compliments", implementation: "'That's interesting - what would make you actually switch?'"}
    - {principle: "Seek the truth, not validation", implementation: "Probes for negative signals, doesn't accept surface positivity"}

  quality_criteria:
    - {metric: "Objections per session", target: "≥ 2", description: "Count of distinct objections raised"}
    - {metric: "Critical questions asked", target: "≥ 3", description: "Questions challenging core assumptions"}
    - {metric: "Flip rate", target: "≥ 15%", description: "Sessions where initial positive flips to concern"}
    - {metric: "No-objection rate", target: "< 10%", description: "Sessions with zero pushback (indicates failure)"}
    monitoring: "These metrics are tracked per-test and flagged if quality drops"

  # NEW: Input Quality Gates (from PRD Section 2.7.5)
  input_quality_gates:
    - {issue: "Vague ICP", warning: "Your ICP is too broad. Results may not be actionable.", suggestion: "Try specifying: industry, company size, or role"}
    - {issue: "Leading hypotheses", warning: "Your hypothesis contains assumption of success.", suggestion: "Reframe as 'I believe [X] because [Y]'"}
    - {issue: "Biased source URL", warning: "This URL appears promotional. Results may skew positive.", suggestion: "Consider using customer reviews or forum discussions instead"}
    - {issue: "Missing problem statement", warning: "No clear problem defined.", suggestion: "What pain does your customer experience today?"}

# NEW SECTION: Compliance (from PRD Section 2.6)
compliance:
  data_classification:
    - {type: "Email", classification: "PII", storage: "Encrypted", retention: "Account lifetime + 90 days"}
    - {type: "Name", classification: "PII", storage: "Encrypted", retention: "Account lifetime + 90 days"}
    - {type: "Country", classification: "Personal", storage: "Plain", retention: "Account lifetime + 90 days"}
    - {type: "Payment details", classification: "Sensitive", storage: "Stripe only (not stored)", retention: "Managed by Stripe"}
    - {type: "VAT ID", classification: "Business", storage: "Plain", retention: "Account lifetime + 90 days"}
    - {type: "Proposals", classification: "User content", storage: "Encrypted", retention: "Account lifetime + 90 days"}
    - {type: "Conversations", classification: "User content", storage: "Encrypted", retention: "Account lifetime + 90 days"}
    - {type: "External Injection URLs", classification: "User content", storage: "Encrypted", retention: "Account lifetime + 90 days"}

  requirements:
    - {requirement: "GDPR", applicability: "EU users", implementation: "Data export, deletion on request"}
    - {requirement: "CCPA", applicability: "CA users", implementation: "Opt-out mechanism"}
    - {requirement: "Cookie consent", applicability: "All users", implementation: "Consent banner"}

  consent_at_signup:
    - {item: "Terms of Service", required: true}
    - {item: "Privacy Policy", required: true}
    - {item: "Marketing emails", required: false}

features:
