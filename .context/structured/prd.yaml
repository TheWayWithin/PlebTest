glossary:
  - term: "Validation Test"
    definition: "A single AI simulation session that evaluates an idea against personas"
    context: "Core user action"

  - term: "Idea"
    definition: "A business concept the user wants to validate"
    context: "User creates and manages these"

  - term: "Proposal"
    definition: "Document with problem, solution, hypotheses, current workarounds"
    lifecycle: "Draft → Submitted → Testing → Tested → Archived"

  - term: "Persona"
    definition: "An AI-simulated customer defined by a combination of traits"
    context: "Generated from user's ICP with trait variations"

  # NEW: Missing glossary term
  - term: "Trait"
    definition: "A variable dimension of a persona: demographics, psychographics, or personality (Big Five: openness, conscientiousness, extraversion, agreeableness, neuroticism)"
    context: "Attributes within Persona entity, not a separate entity"

  - term: "ICP"
    definition: "Ideal Customer Profile - target customer description"
    context: "One ICP generates multiple Personas with trait variations"

  - term: "Session"
    definition: "A single conversation instance between user and one persona"
    context: "Container for the interactive validation experience"

  - term: "Verdict"
    definition: "Outcome: Kill (need not validated), Pivot (need validated but proposal doesn't resonate), Build (both validated)"
    context: "Primary deliverable"

  - term: "Confidence Score"
    definition: "Certainty level based on persona consensus, score variance, and user engagement quality"
    context: "Displayed as High/Medium/Low alongside Verdict"

  - term: "Report"
    definition: "Full output document containing Verdict plus reasoning and evidence"
    context: "Deliverable users receive after validation"

  - term: "Anti-Sycophancy Engine"
    definition: "System ensuring personas challenge rather than confirm"
    user_facing: "Honest Feedback"
    context: "Core differentiator"

  - term: "Interactive Mode"
    definition: "Default experience where user actively participates in conversations with personas"
    context: "Primary validation method"

  - term: "Spectator Mode"
    definition: "Optional mode for users to watch AI-driven validation without participating"
    context: "Powerful option for hands-off validation"
    includes: "Nudge Buttons for intervention"

  - term: "Quick Fire Mode"
    definition: "Sub-60-second onboarding hook providing a Risk Score from a single sentence input"
    context: "Fast value demonstration; lead-in to full validation"

  - term: "Assumption Board"
    definition: "Primary report output showing each assumption, evidence, confidence score, and recommended next step"
    context: "Core deliverable structure"

  - term: "Reality Check Panel"
    definition: "Ethical guardrail in report providing 'Minimum Real-World Validation Plan'"
    context: "Ensures users don't over-rely on AI validation"

  - term: "Pushback Presets"
    definition: "User-facing control with three modes: The Cheerleader, The Pragmatist, The Critic"
    context: "Controls Anti-Sycophancy intensity"

  # NEW: Missing glossary term
  - term: "Pre-Mortem Mode"
    definition: "Simulation asking 'The product launched and failed. Why?'"
    context: "Proactive failure analysis"

  # NEW: Missing glossary term
  - term: "External Injection"
    definition: "Feature to ground personas in reality via URL scraping or pasted text"
    context: "Reality-grounding mechanism"

  # NEW: Missing glossary term
  - term: "Nudge Buttons"
    definition: "Spectator Mode controls: Pause, Dig Deeper, Move On"
    context: "User intervention without typing"

  - term: "Iteration"
    definition: "A version of a proposal after edits post-test, tracking changes and previous verdict"
    context: "Supports pivot-and-retest workflow"

