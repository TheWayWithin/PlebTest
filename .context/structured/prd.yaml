        - {priority: 3, offer: "Monthly - Pay Now", incentive: "20% off first month"}
        - {priority: 4, offer: "Monthly - 7-day Trial", incentive: "Card upfront, charged day 8"}
      default_tier: "Growth"
      auth_options: ["Google", "GitHub", "Email/Password"]

