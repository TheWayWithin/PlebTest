    decision_by: "Phase 2 launch"
  - question: "Error tracking"
    context: "Sentry or similar"
    decision_by: "Phase 1 start"
  - question: "CDN for PDFs"
    context: "Report storage/delivery"
    decision_by: "Phase 2 launch"
  - question: "Web scraping service"
    context: "External Injection feature"
    decision_by: "Phase 2 start"

# Business constraints for development decisions (from Appendix A)
