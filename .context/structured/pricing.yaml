product_level_marketing_physics:
  dramatic_difference:
    the_value: "Answers most founders never get - without losing money to find out the hard way"
    the_speed: "Minutes, not months"
    the_mechanism: "A cast of thousands of AI personas, each designed to challenge your idea from a different angle"
    one_liner: "Get the market truth that costs other founders months and thousands of dollars - in minutes, from thousands of AI personas built to find the holes."

  overt_benefits:
    primary: "Know whether to kill, pivot, or build - before you waste months guessing"
    supporting:
      - "Clear the duds in an hour - stop building things nobody wants"
      - "Find your winner - test multiple ideas, pick the one worth building"
      - "No phone calls required - validate without talking to strangers"
      - "Feedback that finds the holes - not flattery that hides them"
      - "Prepared if you DO talk - real interviews go better when you already know the objections"

  reasons_to_believe:
    - name: "The mechanism"
      evidence: "Each persona starts from YOUR ICP, then we tune personality, psychographics, and demographics - creating a representative population that unlocks the genius of the market"
    - name: "Practitioner-built"
      evidence: "Jamie built PlebTest because he needed it - his income depends on it working"
    - name: "Anti-sycophancy by design"
      evidence: "The AI is engineered to challenge, not confirm"
    - name: "Built in public"
      evidence: "Watch Jamie use PlebTest on his own ideas - full transparency"
    - name: "Risk reversal"
      evidence: "7-day free trial + money-back guarantee"

  kitchen_logic:
    population_building: "Your ICP as the seed. Thousands of trait variations as the population. The genius of crowds - without the interviews."
    dud_detection: "When personas consistently poke holes, you've got a dud. Kill it fast, move on."
    diamond_discovery: "When personas love the problem but hate your solution - that's not a dud, that's a pivot. The simulation shows you what they actually want, so you can twist your idea into something they'd pay for."
    one_liner: "Kill the duds. Pivot the rough diamonds. Build the winners."

  future_proof_points:
    - "Testimonials: 'X founders validated, Y duds killed, Z winners launched'"
    - "Performance Data: 'Average time to decision: X minutes'"

  fomo:
    chatgpt_claude: "You get flattery, not feedback. AI assistants are trained to agree - you'll build the wrong thing with a smile on your face."
    friends_family: "They love you too much to tell you it's a dud. You'll waste months to discover what they wouldn't say."
    nothing: "42% of startups fail from no market need. That's the bet you're making."
    diy_cold_calls: "You'll avoid them forever, or do 3 awkward calls and quit. The anxiety wins."

