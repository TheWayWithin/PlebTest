objection_handling:
  - objection: "Can AI really simulate real customers?"
    response: "It can really kill duds in an hour and find the pivot you'd miss. That's what matters."
  - objection: "Why pay when I can just ask ChatGPT?"
    response: "ChatGPT is trained to agree with you. PlebTest is built to challenge you. One makes you feel good, the other makes you ready."
  - objection: "Am I a bad founder for not doing real interviews?"
    response: "You're a founder who wants to be prepared. That's not lazy - that's smart."
  - objection: "What if it says my idea is bad and it's wrong?"
    response: "Then you're out an hour and a coffee. But if it's right, you just saved 3-6 months."
  - objection: "Is this just validation theater for investors?"
    response: "Investors see through theater. This gives you real objections to address - that's what they want to hear."

value_ladder:
  - stage: "Entry"
    tier: "Solo"
    behavior: "Validate one idea"
    next_step: "Hit limit or get second idea → Growth"
  - stage: "Expansion"
    tier: "Growth"
    behavior: "Compare multiple ideas"
    next_step: "Need more slots or volume → Scale"
  - stage: "Power Use"
    tier: "Scale"
    behavior: "Rapid-fire validation"
    next_step: "Client work or max volume → Pro"
  - stage: "Professional"
    tier: "Pro"
    behavior: "Agency-scale validation"
    next_step: "Ceiling reached - retain"

progression_logic:
  - "Each tier ~2x price, ~3x capacity"
  - "Upgrades feel earned, not forced"
  - "Value increases faster than price"
