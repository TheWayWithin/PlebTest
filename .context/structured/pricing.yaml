philosophy:
  statement: "Price for the decision, not the tool. Each test that kills a bad idea early saves months of wasted building. We charge a fraction of what one wrong decision costs."
  principles:
    - name: "Value-based, not cost-based"
      description: "Price reflects decisions accelerated, not compute consumed"
    - name: "Low barrier, clear path up"
      description: "Solo founders can start at coffee-budget pricing; power users get volume"
    - name: "Usage-aligned growth"
      description: "You pay more only when you need more (ideas to test, depth of analysis)"
    - name: "No punishment for success"
      description: "Unlimited ideas explored within tier; pay for capacity, not outcomes"

