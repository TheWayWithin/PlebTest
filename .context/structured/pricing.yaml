    - name: "ChatGPT/Claude"
      cost: "$20/mo"
      what_you_get: "Flattery, not feedback"
    - name: "Build and pray"
      cost: "$0 upfront"
      what_you_get: "3-6 months wasted on wrong idea"

  anchor: "Other founders waste 3-6 months and thousands of dollars building the wrong thing. You spend $9.95 and one hour."

